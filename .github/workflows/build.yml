name: Build DEB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Theos & SDKs
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          curl -LO https://github.com/theos/sdks/releases/download/v14.5/iPhoneOS14.5.sdk.tar.xz
          tar -xf iPhoneOS14.5.sdk.tar.xz -C $HOME/theos/sdks
          rm iPhoneOS14.5.sdk.tar.xz

      - name: Build Package
        run: |
          if [ -f Makefile ]; then
            make package FINALPACKAGE=1
          elif [ -d Tweak ] && [ -f Tweak/Makefile ]; then
            cd Tweak && make package FINALPACKAGE=1
          else
            find . -name Makefile -execdir make package FINALPACKAGE=1 \;
          fi

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: remotecompanion-deb
          path: |
            packages/*.deb
            **/packages/*.deb
