name: Build DEB

on:
  push:
    branches:
      - '*'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Theos & iOS 16.5 SDK
        run: |
          sudo mkdir -p /opt
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          sudo ln -s $HOME/theos /opt/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

          # 从官方已发行的 Release 包拉取完整的 iOS 16.5 SDK
          mkdir -p $HOME/theos/sdks
          curl -LO https://github.com/theos/sdks/releases/download/v1.0/iPhoneOS16.5.sdk.tar.xz
          tar -xf iPhoneOS16.5.sdk.tar.xz -C $HOME/theos/sdks/
          rm iPhoneOS16.5.sdk.tar.xz

      - name: Build Package
        run: |
          if [ -f Makefile ]; then
            make package FINALPACKAGE=1 TARGET=iphone:clang:16.5:15.0
          elif [ -d Tweak ] && [ -f Tweak/Makefile ]; then
            cd Tweak && make package FINALPACKAGE=1 TARGET=iphone:clang:16.5:15.0
          else
            find . -name Makefile -execdir make package FINALPACKAGE=1 TARGET=iphone:clang:16.5:15.0 \;
          fi

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: remotecompanion-deb
          path: |
            packages/*.deb
            **/packages/*.deb
