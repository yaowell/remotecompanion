name: Build DEB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Theos & Private SDKs
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          rm -rf $HOME/theos/sdks
          curl -LO https://github.com/theos/sdks/archive/refs/heads/master.tar.gz
          mkdir -p $HOME/theos/sdks
          tar -xzf master.tar.gz -C $HOME/theos/sdks --strip-components=1
          rm master.tar.gz

      - name: Build Package
        run: |
          if [ -f Makefile ]; then
            make package FINALPACKAGE=1
          elif [ -d Tweak ] && [ -f Tweak/Makefile ]; then
            cd Tweak && make package FINALPACKAGE=1
          else
            find . -name Makefile -execdir make package FINALPACKAGE=1 \;
          fi

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: remotecompanion-deb
          path: |
            packages/*.deb
            **/packages/*.deb
