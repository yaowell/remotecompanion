name: Build DEB

on:
  push:
    branches:
      - '*'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          brew install ldid

      - name: Install Theos & iOS 16.5 SDK
        run: |
          sudo mkdir -p /opt
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          sudo ln -s $HOME/theos /opt/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

          git clone --depth=1 https://github.com/theos/sdks.git $HOME/sdks-repo
          mkdir -p $HOME/theos/sdks
          cp -R $HOME/sdks-repo/iPhoneOS16.5.sdk $HOME/theos/sdks/
          rm -rf $HOME/sdks-repo

          # 核心修复：在 Theos 的 include 目录中创建 xpc 文件夹并补全 xpc.h 头文件引用
          mkdir -p $HOME/theos/include/xpc
          echo '#include_next <xpc/xpc.h>' > $HOME/theos/include/xpc/xpc.h
          # 如果需要更完整的定义，可以直接从系统的 libinfo 或其他开源项目引入，这里用兼容转发或者直接适配

      - name: Build Package
        run: |
          SDK_PATH="$HOME/theos/sdks/iPhoneOS16.5.sdk"
          BUILD_FLAGS="FINALPACKAGE=1 TARGET=iphone:clang:16.5:15.0 SYSROOT=$SDK_PATH ADDITIONAL_CFLAGS='-I$HOME/theos/include'"

          if [ -f Makefile ]; then
            make package $BUILD_FLAGS
          elif [ -d Tweak ] && [ -f Tweak/Makefile ]; then
            cd Tweak && make package $BUILD_FLAGS
          else
            find . -name Makefile -execdir make package $BUILD_FLAGS \;
          fi

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: remotecompanion-deb
          path: |
            packages/*.deb
            **/packages/*.deb
