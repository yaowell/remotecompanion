name: Build DEB

on:
  push:
    branches:
      - '*'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          brew install ldid

      - name: Install Theos & iOS 16.5 SDK
        run: |
          sudo mkdir -p /opt
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          sudo ln -s $HOME/theos /opt/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

          git clone --depth=1 https://github.com/theos/sdks.git $HOME/sdks-repo
          mkdir -p $HOME/theos/sdks
          cp -R $HOME/sdks-repo/iPhoneOS16.5.sdk $HOME/theos/sdks/
          rm -rf $HOME/sdks-repo

          # 清理掉之前可能残留的有问题的 xpc 文件夹
          rm -rf $HOME/theos/include/xpc

      - name: Build Package
        run: |
          SDK_PATH="$HOME/theos/sdks/iPhoneOS16.5.sdk"
          # 核心修复：添加 -fno-modules 关闭 Clang 严格模块检查，避免 xpc.h 触发 Foundation 连锁崩溃
          BUILD_FLAGS="FINALPACKAGE=1 TARGET=iphone:clang:16.5:15.0 SYSROOT=$SDK_PATH ADDITIONAL_CFLAGS='-fno-modules'"

          if [ -f Makefile ]; then
            make package $BUILD_FLAGS
          elif [ -d Tweak ] && [ -f Tweak/Makefile ]; then
            cd Tweak && make package $BUILD_FLAGS
          else
            find . -name Makefile -execdir make package $BUILD_FLAGS \;
          fi

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: remotecompanion-deb
          path: |
            packages/*.deb
            **/packages/*.deb
