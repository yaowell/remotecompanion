name: Build DEB

on:
  push:
    branches:
      - '*'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          brew install ldid

      - name: Install Theos & iOS 16.5 SDK
        run: |
          sudo mkdir -p /opt
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          sudo ln -s $HOME/theos /opt/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

          git clone --depth=1 https://github.com/theos/sdks.git $HOME/sdks-repo
          mkdir -p $HOME/theos/sdks
          cp -R $HOME/sdks-repo/iPhoneOS16.5.sdk $HOME/theos/sdks/
          rm -rf $HOME/sdks-repo

          # 写入完美的 xpc.h 桥接头文件
          mkdir -p $HOME/theos/include/xpc
          cat << 'EOF' > $HOME/theos/include/xpc/xpc.h
          #ifndef __XPC_XPC_H__
          #define __XPC_XPC_H__

          #include <stddef.h>
          #include <stdint.h>
          #include <stdbool.h>
          #include <dispatch/dispatch.h>

          #ifdef __cplusplus
          extern "C" {
          #endif

          typedef void* xpc_object_t;
          typedef void* xpc_connection_t;
          typedef const struct _xpc_type_s *xpc_type_t;
          typedef void (^xpc_handler_t)(xpc_object_t object);

          xpc_object_t xpc_dictionary_create(const char *const *keys, xpc_object_t *values, size_t count);
          void xpc_object_set_value(xpc_object_t xdict, const char *key, xpc_object_t value);
          const char *xpc_dictionary_get_string(xpc_object_t xdict, const char *key);
          int64_t xpc_dictionary_get_int64(xpc_object_t xdict, const char *key);
          bool xpc_dictionary_get_bool(xpc_object_t xdict, const char *key);

          void xpc_connection_set_event_handler(xpc_connection_t connection, xpc_handler_t handler);
          void xpc_connection_resume(xpc_connection_t connection);
          void xpc_connection_send_message(xpc_connection_t connection, xpc_object_t message);
          void xpc_connection_send_barrier(xpc_connection_t connection, dispatch_block_t barrier);
          void xpc_connection_cancel(xpc_connection_t connection);

          #ifdef __cplusplus
          }
          #endif

          #endif
          EOF

      - name: Build Package
        run: |
          SDK_PATH="$HOME/theos/sdks/iPhoneOS16.5.sdk"
          
          # 直接使用无嵌套的纯净参数传递，彻底避免 bash 引号解析崩溃
          export FINALPACKAGE=1
          export TARGET="iphone:clang:16.5:15.0"
          export SYSROOT="$SDK_PATH"
          export ADDITIONAL_CFLAGS="-I$HOME/theos/include -Wno-error -Wno-deprecated-declarations"

          if [ -f Makefile ]; then
            make package
          elif [ -d Tweak ] && [ -f Tweak/Makefile ]; then
            cd Tweak && make package
          else
            find . -name Makefile -execdir make package \;
          fi

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: remotecompanion-deb
          path: |
            packages/*.deb
            **/packages/*.deb
